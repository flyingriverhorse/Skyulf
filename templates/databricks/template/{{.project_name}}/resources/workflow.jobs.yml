          environment_key: skyulf
      environments:
        - environment_key: skyulf
          spec:
            client: "4"
            dependencies:
              - ${workspace.file_path}/dist/skyulf_core-0.9.0-py3-none-any.whl
              - mlflow==3.16.1
    promote:
      name: ${bundle.name}_promote
      tasks:
        - task_key: promote
          notebook_task:
            notebook_path: ../src/workflow.py
            base_parameters:
              action: promote
              config_path: ${workspace.file_path}/config/workflow.json
          environment_key: skyulf
      environments:
        - environment_key: skyulf
          spec:
            client: "4"
            dependencies:
              - ${workspace.file_path}/dist/skyulf_core-0.9.0-py3-none-any.whl
              - mlflow==3.16.1
    score:
      name: ${bundle.name}_score
      tasks:
        - task_key: score
          notebook_task:
