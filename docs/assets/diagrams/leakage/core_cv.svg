<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="280" viewBox="0 0 1040 280" role="img" aria-labelledby="core_cv-title"><title id="core_cv-title">Core CV: create a fresh pipeline for each raw-data fold</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="1040" height="280" rx="12" fill="#f8fafc"/><g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round"><path d="M155,125 L193,125" marker-end="url(#arrow)"/><path d="M348,125 L386,125" marker-end="url(#arrow)"/><path d="M569,125 L607,125" marker-end="url(#arrow)"/><path d="M790,125 L828,125" marker-end="url(#arrow)"/><path d="M921,170 L921,225 L270,225 L270,160" stroke-dasharray="6 5" marker-end="url(#arrow)"/></g><rect x="20" y="90" width="135" height="70" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="87.5" y="130">Raw rows</tspan></text><rect x="193" y="90" width="155" height="70" rx="9" fill="#e8f0fb" stroke="#245997" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="270.5" y="120">KFold</tspan><tspan x="270.5" y="140">split raw indices</tspan></text><rect x="386" y="80" width="183" height="90" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="477.5" y="110">SplitDataset</tspan><tspan x="477.5" y="130">train = fold train</tspan><tspan x="477.5" y="150">test = fold validation</tspan></text><rect x="607" y="80" width="183" height="90" rx="9" fill="#e9f5ee" stroke="#287447" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="698.5" y="110">NEW SkyulfPipeline</tspan><tspan x="698.5" y="130">fit on fold train</tspan><tspan x="698.5" y="150">only</tspan></text><rect x="828" y="80" width="187" height="90" rx="9" fill="#e9f5ee" stroke="#287447" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="921.5" y="110">Predict raw</tspan><tspan x="921.5" y="130">fold validation</tspan><tspan x="921.5" y="150">and record score</tspan></text><text x="580" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Repeat with a new pipeline for the next fold</text></svg>
