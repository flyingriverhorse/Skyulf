<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="backend_decisions-title"><title id="backend_decisions-title">Backend: leakage admission and fold-refit capability are separate decisions</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs><rect width="1100" height="450" rx="12" fill="#f8fafc"/><g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round"><path d="M200,70 L254,70" marker-end="url(#arrow)"/><path d="M499,69 L568,69" marker-end="url(#arrow)"/><path d="M376,108 L376,164" marker-end="url(#arrow)"/><path d="M499,202 L568,202" marker-end="url(#arrow)"/><path d="M800,187 L852,187" marker-end="url(#arrow)"/><path d="M684,246 L684,320" marker-end="url(#arrow)"/></g><rect x="20" y="32" width="180" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="110" y="65">Run request</tspan><tspan x="110" y="85">selected execution scope</tspan></text><rect x="254" y="32" width="245" height="76" rx="9" fill="#e8f0fb" stroke="#245997" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="376.5" y="65">Full-graph leakage gate</tspan><tspan x="376.5" y="85">operation-aware checks</tspan></text><rect x="568" y="20" width="232" height="98" rx="9" fill="#fff0e8" stroke="#aa4b23" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#172b3a"><tspan x="684" y="54">Detected violation + raise</tspan><tspan x="684" y="74">HTTP 400</tspan><tspan x="684" y="94">No job created</tspan></text><rect x="254" y="164" width="245" height="76" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2"/><text text-anchor="middle" font-family="Segoe UI, sans-serif"