# © 2026 Murat Unsal — Skyulf Project
#
# SonarQube Cloud (SonarCloud) analysis configuration. The organization and
# project key must match the project imported on sonarcloud.io — adjust both
# if it was imported under different names.

sonar.organization=flyingriverhorse
sonar.projectKey=flyingriverhorse_Skyulf
sonar.projectName=Skyulf

sonar.sources=backend,skyulf-core/skyulf,frontend/ml-canvas/src
sonar.tests=tests,skyulf-core/tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/__snapshots__/**,\
  frontend/ml-canvas/src/**/*.test.*,\
  frontend/ml-canvas/src/test/**,\
  static/ml_canvas/**,\
  index.html

# Cobertura XML generated by the scan job before the scanner runs
# (.github/workflows/pr_check.yml -> sonarcloud-scan).
sonar.python.coverage.reportPaths=coverage-backend.xml,coverage-core.xml
