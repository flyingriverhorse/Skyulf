# Called once by PR Check; workflow_dispatch supports focused manual reruns.
name: Skyulf-Core Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyulf-core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: skyulf-core test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        shard: [0, 1, 2, 3]
    env:
      COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies (uv)
        run: |
          echo "::group::Installing dependencies (uv pip install -r requirements-ci.txt)"
          uv pip install --system -q -r requirements-ci.txt
          echo "::endgroup::"
          echo "## 🧪 skyulf-core test suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Run skyulf-core tests
        # Collect the complete suite normally, then assign whole files to four
        # stable shards. The coverage job enforces the unchanged 90% floor only
        # after every shard passes and all four branch-coverage files combine.
        run: |
          bash .github/scripts/run_check.sh "pytest skyulf-core/tests shard ${{ matrix.shard }}/4" \
            python .github/scripts/run_core_shard.py \
              --shard-index "${{ matrix.shard }}" --shard-count 4 \
              skyulf-core/tests -q --disable-warnings \
              --cov=skyulf-core/skyulf --cov-branch --cov-report=

      - name: Upload shard coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-shard-${{ matrix.shard }}
          path: .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error

  coverage:
    name: skyulf-core combined coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install dependencies (uv)
        run: uv pip install --system -q -r requirements-ci.txt
      - name: Download all shard coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-core-shard-*
          merge-multiple: true
      - name: Combine complete Core coverage and enforce the floor
        run: |
          bash .github/scripts/run_check.sh "Core combined branch coverage >= 90%" \
            python .github/scripts/combine_core_coverage.py
      - name: Share Core coverage with SonarQube
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: error
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: skyulf-core
          files: coverage-core.xml
          disable_search: true

  package:
    name: skyulf-core package and complexity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install dependencies (uv)
        run: uv pip install --system -q -r requirements-ci.txt
      - name: Complexity report (lizard, CCN > 8)
        run: |
          echo "::group::Full-tree lizard report (CCN > 8, non-blocking)"
          lizard skyulf-core/skyulf --CCN 8 -w || true
          echo "::endgroup::"
      - name: Complexity gate (lizard, CCN 10)
        run: |
          bash .github/scripts/run_check.sh "Lizard complexity gate (skyulf-core, CCN 10)" \
            lizard skyulf-core/skyulf --CCN 10 -w
      - name: Build and verify distributable wheel
        run: |
          echo "::group::Build skyulf-core wheel"
          uv pip install --system build
          python -m build --outdir skyulf-core/dist skyulf-core
          echo "::endgroup::"
          bash .github/scripts/run_check.sh "isolated skyulf-core wheel install" \
            python .github/scripts/verify_skyulf_core_distribution.py \
              skyulf-core/dist/*.whl

  skyulf-core-docker-smoke:
    name: Docker test image smoke test (skyulf-core standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone wheel smoke image
        run: docker build -f skyulf-core/tests/docker/Dockerfile.smoke -t skyulf-core-smoke skyulf-core
      - name: Train, predict and save/load outside the source checkout
        run: docker run --rm --network none skyulf-core-smoke
