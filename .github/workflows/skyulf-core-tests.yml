# Called once by PR Check; workflow_dispatch supports focused manual reruns.
name: Skyulf-Core Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skyulf-core-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: skyulf-core test suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies (uv)
        run: |
          echo "::group::Installing dependencies (uv pip install -r requirements-ci.txt)"
          uv pip install --system -q -r requirements-ci.txt
          echo "::endgroup::"
          echo "## 🧪 skyulf-core test suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Complexity report (lizard, CCN > 8)
        run: |
          echo "::group::Full-tree lizard report (CCN > 8, non-blocking)"
          lizard skyulf-core/skyulf --CCN 8 -w || true
          echo "::endgroup::"

      - name: Complexity gate (lizard, CCN 10)
        run: |
          bash .github/scripts/run_check.sh "Lizard complexity gate (skyulf-core, CCN 10)" \
            lizard skyulf-core/skyulf --CCN 10 -w

      - name: Run skyulf-core tests
        # --cov=skyulf-core/skyulf scopes coverage to the package itself, so
        # the ratchet floor can be enforced directly here without a separate
        # "re-run and clobber coverage.xml" step (see git history for the CI
        # bug that pattern used to cause when both suites shared one job).
        # No -s: keeps captured stdout/print output out of the log for
        # passing tests (still shown automatically for any failure).
        # Report all failures in one run.
        # Floor is 90 against a measured 96% (CI run 34032836551). The 45 it
        # replaces was 51 points below the suite's actual coverage, so it could
        # never fail and was not a ratchet at all. 90 keeps enough headroom for
        # optional-extras variance between runners while still failing loudly
        # if a whole subsystem loses its tests.
        run: |
          bash .github/scripts/run_check.sh "pytest skyulf-core/tests (coverage ≥ 90%)" \
            pytest skyulf-core/tests -q --disable-warnings \
              --cov=skyulf-core/skyulf --cov-branch --cov-report=term-missing \
              --cov-report=xml:coverage-core.xml --cov-fail-under=90

      - name: Share Core coverage with SonarQube
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: coverage-core.xml
          if-no-files-found: error

      - name: Build and verify distributable wheel
        run: |
          echo "::group::Build skyulf-core wheel"
          uv pip install --system build
          rm -rf skyulf-core/dist
          python -m build --outdir skyulf-core/dist skyulf-core
          echo "::endgroup::"
          bash .github/scripts/run_check.sh "isolated skyulf-core wheel install" \
            python .github/scripts/verify_skyulf_core_distribution.py \
              skyulf-core/dist/*.whl

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: skyulf-core
          files: coverage-core.xml
          disable_search: true

  skyulf-core-docker-smoke:
    name: Docker test image smoke test (skyulf-core standalone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build standalone wheel smoke image
        run: docker build -f skyulf-core/tests/docker/Dockerfile.smoke -t skyulf-core-smoke skyulf-core
      - name: Train, predict and save/load outside the source checkout
        run: docker run --rm --network none skyulf-core-smoke
