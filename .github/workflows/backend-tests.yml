# Called once by PR Check; workflow_dispatch supports focused manual reruns.
name: Backend Tests

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend test suite (engine ${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # Engine-parity gate (migration plan Phase 1.4): the suite must stay
        # green under both DataFrame engines; polars is the platform default.
        engine: [polars, pandas]
    env:
      SKYULF_ENGINE: ${{ matrix.engine }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies (uv)
        run: |
          echo "::group::Installing dependencies (uv pip install -r requirements-ci.txt)"
          uv pip install --system -q -r requirements-ci.txt
          echo "::endgroup::"
          echo "## 🧪 Backend test suite" >> "$GITHUB_STEP_SUMMARY"

      - name: Complexity report (lizard, CCN > 8)
        run: |
          echo "::group::Full-tree lizard report (CCN > 8, non-blocking)"
          lizard backend --CCN 8 -w || true
          echo "::endgroup::"

      - name: Complexity gate (lizard, CCN 10)
        run: |
          bash .github/scripts/run_check.sh "Lizard complexity gate (backend, CCN 10)" \
            lizard backend --CCN 10 -w

      - name: Run backend tests
        # Scoped to the root tests/ dir (backend API, Celery, DB, node
        # wiring) — skyulf-core's own test suite lives in skyulf-core/tests
        # and runs in skyulf-core-tests.yml instead.
        # No -s: keeps captured stdout/print output out of the log for
        # passing tests (still shown automatically for any failure).
        # Report all failures in one run.
        # No --cov-fail-under: OC-77 scoped the ratchet to skyulf-core, whose
        # floor of 45 sat 51 points under its actual coverage. Backend measures
        # 77% on both engine legs (CI run 34032836559), so a floor here is a
        # separate decision — it has to be chosen against 77, not copied.
        run: |
          bash .github/scripts/run_check.sh "pytest tests (backend)" \
            pytest tests -q --disable-warnings \
              --cov=backend --cov-branch --cov-report=term-missing --cov-report=xml:coverage-backend.xml

      - name: Share backend coverage with SonarQube
        if: ${{ !cancelled() && matrix.engine == 'polars' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: coverage-backend.xml
          if-no-files-found: error

      - name: Upload coverage reports to Codecov
        # Single upload per push: both matrix legs produce the same coverage,
        # so only the default-engine leg reports it.
        if: matrix.engine == 'polars'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: backend
          files: coverage-backend.xml
          disable_search: true

  docker-test-smoke:
    name: Docker test image smoke test (full monorepo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check backend imports, registry wiring and serialization in Docker
        run: |
          bash .github/scripts/run_check.sh "Docker backend smoke" \
            docker compose -f docker-compose.test.yml run --rm --build unit-tests \
              python -m pytest tests/unit/test_registry_fixes.py \
                tests/unit/test_serialization_values.py -q --disable-warnings --no-cov
