# PR entry point: run each suite once, then reuse its coverage for SonarQube.
name: PR Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-gate:
    name: Workflow validation (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check --strict
          mkdir -p actionlint-bin
          tar -xzf actionlint.tar.gz -C actionlint-bin actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Validate all GitHub Actions workflows
        # Check workflow syntax, expressions and reusable-workflow contracts.
        # Embedded shell/Python linting is outside this gate's scope.
        run: bash .github/scripts/run_check.sh "Workflow validation (actionlint)" actionlint -color -shellcheck= -pyflakes=

  python-gate:
    name: Python Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ matrix.python-version }}-

      - name: Install dependencies (uv)
        run: |
          echo "::group::Installing dependencies (uv pip install -r requirements-ci.txt)"
          uv pip install --system -q -r requirements-ci.txt
          echo "::endgroup::"
          echo "## 🔍 Python Static Checks" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint check (Ruff)
        run: bash .github/scripts/run_check.sh "Ruff lint" ruff check .

      - name: Check generated Databricks template schema
        run: python skyulf-core/templates/databricks/build_schema.py --check

      - name: Format check (Ruff)
        run: bash .github/scripts/run_check.sh "Ruff format" ruff format --check backend skyulf-core tests run_skyulf.py celery_worker.py

      - name: Format Markdown Python examples (Ruff)
        run: |
          git ls-files -z -- 'backend/**/*.md' 'skyulf-core/**/*.md' 'tests/**/*.md' | \
            xargs -0 -r ruff format --preview --check

      - name: Type check (Ty)
        run: bash .github/scripts/run_check.sh "Ty type check" ty check backend skyulf-core/skyulf skyulf-core/tests run_skyulf.py celery_worker.py

  databricks-example-gate:
    name: Databricks example projects drift
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Databricks CLI 1.17.0
        # Offline `bundle init` only; no workspace credentials are configured.
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/databricks/cli/releases/download/v1.17.0/databricks_cli_1.17.0_linux_amd64.tar.gz \
            --output databricks.tar.gz
          echo "6b5c1e08f484d33b4e75eabe0ee3ba1bb9d19d7beedd4b14a1e6993f52a01e23  databricks.tar.gz" | sha256sum --check --strict
          mkdir -p databricks-bin
          tar -xzf databricks.tar.gz -C databricks-bin databricks
          echo "$RUNNER_TEMP/databricks-bin" >> "$GITHUB_PATH"
      - name: Check the example projects against the template
        run: bash .github/scripts/run_check.sh "Databricks example drift" python skyulf-core/templates/databricks/build_example_project.py --check
      # The core test shards have no CLI, so this is the only CI job that renders.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-3.12-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-3.12-
      - name: Install dependencies (uv)
        run: uv pip install --system -q -r requirements-ci.txt
      - name: Check CLI-dependent template contracts and render snapshots
        env:
          SKYULF_BUNDLE_OFFLINE_CLI: "1"
        run: |
          bash .github/scripts/run_check.sh "Databricks template CLI contracts" \
            python -m pytest \
              skyulf-core/tests/integration/platforms/test_template_source_setup.py \
              skyulf-core/tests/integration/platforms/test_template_operational_controls.py \
              skyulf-core/tests/integration/platforms/test_databricks_bundle_template.py \
              skyulf-core/tests/integration/platforms/test_databricks_bundle_generation.py \
              skyulf-core/tests/integration/platforms/test_bundle_runtime_packaging.py \
              skyulf-core/tests/integration/platforms/test_databricks_example_project.py \
              skyulf-core/tests/integration/platforms/test_monitoring_defaults_cleanup.py \
              skyulf-core/tests/integration/platforms/test_databricks_render_snapshots.py -q

  backend-tests:
    name: Backend Tests
    uses: ./.github/workflows/backend-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  core-tests:
    name: Skyulf-Core Tests
    uses: ./.github/workflows/skyulf-core-tests.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-tests:
    name: Frontend Tests
    uses: ./.github/workflows/frontend-tests.yml

  # Tests run even without a token (for example on fork PRs).
  # Only the scanner is token-gated; all artifacts belong to this same run.
  sonar-gate:
    name: Sonar token gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Detect SONAR_TOKEN
        id: detect
        if: ${{ env.SONAR_TOKEN != '' }}
        run: echo "enabled=true" >> "$GITHUB_OUTPUT"

  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sonar-gate, backend-tests, core-tests, frontend-tests]
    if: ${{ needs.sonar-gate.outputs.enabled == 'true' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Disabling shallow clones improves the relevancy of reporting
          fetch-depth: 0

      - name: Download backend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-backend
          path: .

      - name: Download skyulf-core coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-core
          path: .

      - name: Download frontend coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: frontend/ml-canvas/coverage

      # Coverage.py emits paths relative to each measured package. Convert
      # only the downloaded copies; Codecov receives the original reports.
      - name: Normalize Python coverage paths for SonarQube
        run: |
          sed -i 's/filename="/filename="backend\//g' coverage-backend.xml
          sed -i 's/filename="/filename="skyulf-core\/skyulf\//g' coverage-core.xml
          sed -i 's|<source>.*</source>|<source>.</source>|' coverage-backend.xml coverage-core.xml
          test -s frontend/ml-canvas/coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
