# Called by Core Tests so native branch coverage belongs to the same run.
name: Spark Runtime Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKYULF_REQUIRE_SPARK: "1"
      COVERAGE_FILE: .coverage.shard-spark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install Spark and MLflow test dependencies
        run: uv pip install --system -r requirements-spark.txt -r requirements-mlflow.txt
      - name: Require the Spark pyfunc integration dependencies
        run: python -c "import mlflow, pyspark"
      - name: Exercise Spark JVM and Python workers
        run: >-
          python -m pytest skyulf-core/tests/spark -q -o addopts=
          --cov=skyulf-core/skyulf --cov-branch --cov-report=
      - name: Upload Spark coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-shard-spark
          path: .coverage.shard-spark
          include-hidden-files: true
          if-no-files-found: error

  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKYULF_REQUIRE_DELTA: "1"
      COVERAGE_FILE: .coverage.shard-delta
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install optional Delta test dependencies
        run: uv pip install --system -r requirements-delta.txt
      - name: Exercise real Delta transactions and publish admission
        run: >-
          python -m pytest
          skyulf-core/tests/integration/platforms/test_batch_contract.py
          skyulf-core/tests/integration/platforms/test_batch_admission.py
          skyulf-core/tests/integration/platforms/test_feature_group_delta.py
          skyulf-core/tests/integration/platforms/test_delta_publish.py -q -o addopts=
          --cov=skyulf-core/skyulf --cov-branch --cov-report=
      - name: Upload Delta coverage data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core-shard-delta
          path: .coverage.shard-delta
          include-hidden-files: true
          if-no-files-found: error
