name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Monday 06:00 UTC — surfaces newly-published CVEs against pinned
    # dependencies even when no code changes land.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyscan:
    name: Dependency vulnerability scan (pyscan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Install pyscan
        run: uv pip install --system "pyscan-rs>=2.1.3"

      # pyscan cannot parse the uv.lock (revision 3): on a bare runner it
      # falls back to pip/PyPI lookups and substitutes unreleased prerelease
      # versions (e.g. "sqlalchemy 2.1.0-0b3"), producing bogus findings.
      # Export the lockfile to fully-pinned requirements and scan those, so
      # OSV checks run against exactly the versions we ship. .pyscanignore
      # is still honoured. Exit is non-zero on any un-ignored vulnerability.
      - name: Export locked versions
        run: uv export --frozen --format requirements-txt --no-hashes --no-emit-project -o locked-requirements.txt

      - name: Scan dependencies (locked pins vs OSV)
        run: |
          mkdir scan-root
          mv locked-requirements.txt scan-root/requirements.txt
          cp .pyscanignore scan-root/
          pyscan -d scan-root
