# © 2026 Murat Unsal — Skyulf Project
#
# SonarQube Cloud (SonarCloud) analysis: duplication, cognitive complexity,
# and security hotspots across backend + skyulf-core + frontend. Complements
# the ruff/ty gate (pr_check.yml) and Codecov coverage. Requires a
# SONAR_TOKEN repository secret (sonarcloud.io -> My Account -> Security);
# the scan step is skipped when the secret is absent so forks and
# unconfigured environments stay green.

name: SonarCloud

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Disabling shallow clones improves the relevancy of reporting
          fetch-depth: 0

      - name: SonarQube Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
