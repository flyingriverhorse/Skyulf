name: Codacy Analysis

on:
  workflow_dispatch:

jobs:
  codacy-analysis-cli:
    name: Codacy Analysis CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@6f415a0d3790c227a9cff580098545188e0f4e5a # master (pinned)
        with:
          project-token: ${{ secrets.CODACY_API_TOKEN }}
          verbose: true
          output: codacy_results.json
          format: json
          # tool: flake8

      - name: Upload Analysis Results
        uses: actions/upload-artifact@v7
        with:
          name: codacy-results
          path: codacy_results.json
