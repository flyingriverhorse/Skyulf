# © 2025 Murat Unsal — Skyulf Project

[project]
name = "skyulf"
version = "0.8.16"
description = "MLOps web application for privacy-preserving ML workflows"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",

    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
]
dependencies = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.4,<4.0.0",
    "aiosqlite>=0.19.0,<1.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "fastapi>=0.104.0,<1.0.0",
    "httpx>=0.25.0,<1.0.0",
    "numpy>=1.24.0",
    "orjson>=3.9.0",
    "pandas>=2.0.0,<3.0.0",
    "polars>=1.43.2",
    "pyarrow>=23.0.1",
    "pydantic>=2.4.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.27",
    "redis>=5.0.0,<6.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "joblib>=1.3.0",
    "imbalanced-learn>=0.14.1,<1.0.0",
    "scipy>=1.10.0,<2.0.0",
    "statsmodels>=0.14.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "uvicorn[standard]>=0.24.0,<1.0.0",
    "xgboost>=2.1.4",
    "lightgbm>=4.0.0",
    "shap>=0.46.0,<1.0.0",
    "optuna>=4.0,<5",
    "optuna-integration>=4.0,<5",
    "skyulf-core>=0.5.0",
    "rich>=13.0.0",
    "tqdm>=4.67.1",
    "cmaes>=0.10",
    "causal-learn>=0.1.3.0",
    "boto3>=1.34.0",
    "s3fs>=2023.12.0",
    "patsy>=0.5.0,<2.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk[fastapi]>=2.0.0",
    "xlsx2csv>=0.8.0",
    "openpyxl>=3.1.0",
    "rapidfuzz>=3.6.1,<4.0.0",
    "vadersentiment>=3.3.2,<4.0.0",
    "ty>=0.0.55",
    "sentence-transformers>=2.2.0",
    "pre-commit>=4.3.0",
]

[project.optional-dependencies]
geo = [
    "geopandas>=1.1.2,<1.2.0",
    "shapely>=2.0.2,<2.2.0",
    "pyproj>=3.6.0,<3.8.0",
    "rtree>=1.3.0,<2.0.0",
    "libpysal>=4.10.0,<5.0.0",
    "esda>=2.5.0,<3.0.0",
]
auth = [
    "python-jose[cryptography]>=3.3.0,<4.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "bcrypt>=4.0.1",
]
viz = [
    "matplotlib>=3.9.4",
    "seaborn>=0.13.2",
    "plotly>=6.3.0",
]
nlp = [
    "langid>=1.1.6",
    "vadersentiment>=3.3.2",
    "rapidfuzz>=3.6.1",
]
all = [
    "skyulf[geo,auth,viz,nlp]",
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    # Test stack
    "pytest>=7.4.0,<10.0.0",
    "pytest-asyncio>=0.21.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "hypothesis>=6.100,<7.0.0",
    "syrupy>=4.0.0",
    "pytest-benchmark>=5.0.0,<6.0.0",

    # Linters/formatters/typecheckers (>=0.15: PLC0415 rule, audit finding F-11)
    "ruff>=0.15,<1.0",

    # Dev helpers
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=19.0.0,<41.0.0",
    "pre-commit>=3.4.0",
    "pre-commit-hooks>=4.6.0",  # Hygiene hooks run via python -m (avoids AppLocker-blocked .exe wrappers)
    "ipython>=8.18.1",
    "jupyter>=1.1.1",

    # Security scanners
    "pyscan-rs>=2.1.3",  # Rust-based dependency vulnerability scanner (OSV)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["skyulf-core"] # Allow test imports from skyulf-core without needing to install it
# Benchmarks (pytest-benchmark) are opt-in: skipped by default so normal runs
# stay fast. Run them explicitly with ``--benchmark-only``.
addopts = "--benchmark-skip"
markers = [
    "benchmark: performance benchmarks (opt-in; run with --benchmark-only)",
    "integration: requires a live backing service (e.g. Redis) — run via tests/docker/run_integration_tests.ps1|sh",
]

[tool.coverage.run]
# Repo-relative paths in Cobertura XML so CI scanners (SonarCloud, Codecov)
# resolve reports against the repository root (SonarCloud Python coverage docs).
relative_files = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".venv",
    "site",
    "exports",
    "uploads",
    "static",
    "frontend",
    "tmp_repro_artifacts",
    "build",
    "dist",
]

[tool.ruff.lint]
# UP (pyupgrade), B (bugbear), C4 (comprehensions), SIM (simplify), PERF
# (perflint) added on top of the original flake8-parity set (E9/F63/F7/F82)
# plus import sorting (I), now that the codebase targets py312 only.
# BLE (blind-except) enabled repo-wide (audit finding F-23): skyulf-core
# triaged first, then backend/ and root tests/ — every remaining broad
# catch carries a justified per-site `# noqa: BLE001 - <reason>` waiver.
# PLC0415 (import-outside-top-level) enforced in the published library
# skyulf-core/skyulf/ (audit finding F-11): 173 deferred imports hoisted,
# 29 optional-extra imports waived per-site. Tests, entry points and
# backend stay exempt via per-file-ignores below.
# F401 (unused-import) enabled repo-wide (audit finding OC-09): the flake8-parity
# set covers *undefined* names only, so orphans went unpoliced — neither `ty` nor
# the formatter reports them. Two left behind by the OC-130/OC-152 fixes passed
# every gate and were caught only by an external linter. Of 27 sites, 22 were
# dead and auto-fixed; the rest are availability/side-effect probes carrying a
# per-site `# noqa: F401 - <reason>` waiver, as with BLE001 above. Pre-commit
# runs ruff with `--fix`, so orphans are now stripped automatically.
# F841 (unused-variable) added in the same pass. All 19 sites were in tests and
# none were merely untidy: **three were tests whose bodies ended before any
# assertion**, so they had always passed trivially — one completed, two deleted
# (one redundant with 22 existing tests elsewhere, one provably unsatisfiable
# because plain argmax already scored 1.0 on its fixture). The rest: one test
# renamed because its name claimed a FAILED status its code path cannot reach,
# one missing parallel assertion added, one weak `!=` strengthened to an exact
# mapping check, and the remainder were plain dead bindings. **An unused local
# in a test is a missing-assertion signal first and a lint problem second —
# check the test body, don't just strip the binding.** Two traps: (1) scanning
# for `assert` statements over-reports, since mock `assert_called()` /
# `assert_awaited_once()` and `pytest.raises` blocks are real assertions that
# such a scan cannot see — 3 of the 6 it flagged were fine; (2) no `--fix` was
# used, because every F841 fix is marked unsafe: only a human can tell a dead
# assignment from an accidentally deleted use.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
    "F401",
    "F841",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "PERF",
    "BLE",
    "PLC0415",
    "D",
]
# E203: owned by the formatter. UP042/046/047: StrEnum/PEP 695 need
# case-by-case review, not blanket enforcement. B008: FastAPI's Depends()
# default-argument idiom, not a bug.
#
# These five are the whole ignore list — the `D` work list that used to sit here
# is empty. `D` is selected as a family (convention = "google" below), so an
# entry was deleted as soon as its rule reached zero: first the four
# auto-fixable ones (D202/D209/D212/D403, 772 sites), then D200 (72) and D301
# (5) by hand because ruff's own fixes were wrong for them, then the remaining
# ten rules — 822 sites, 722 of them D1xx "missing docstring" — written by hand,
# because no tool can produce prose. That 822 is the count *after* the
# tests/examples/benchmarks waiver in per-file-ignores below; without it the
# bill was 3,350.
#
# **But 822 was only what ruff could see.** The D1xx "missing docstring" rules
# fire on *public* definitions only, and publicity is derived from the whole
# dotted module path: a leading underscore on the module, or on ANY enclosing
# package, makes everything beneath it private and therefore exempt. That hid 82
# more sites behind `backend/ml_pipeline/{_internal,_execution,_services}` and
# `skyulf-core/skyulf/modeling/_tuning` plus the underscore-prefixed
# modeling/preprocessing modules — 112 of 327 in-scope modules, including the
# job routers and the whole tuning engine. All 82 are now written by hand too.
# The D2xx/D4xx *formatting* rules are not privacy-gated (they apply to whatever
# docstring exists), which is why the automated part of the pass did reach those
# files and only the missing-docstring rules were missed.
#
# So a clean `ruff check .` does NOT prove every function has a docstring. To
# audit a private module, copy it to a public filename outside its package and
# lint the copy against a config that selects only `D` with the google
# convention; the reported line numbers are unchanged, since the copy is
# byte-identical. Renaming the real file is not an option — the underscore is
# deliberate encapsulation.
#
# Matching blind spot for length: `E501` is not selected and `ruff format` will
# not reflow a docstring or a comment, so a 105-character docstring line passes
# every gate this repo runs. Count characters when you write prose.
#
# Do not re-add a `D` entry to make a new violation go away. Write the
# docstring: Google style, one line minimum, and `ruff check` before committing.
# Every `D` fix ruff offers is marked unsafe, so pre-commit's `--fix` will never
# write one for you.
ignore = ["E203", "UP042", "UP046", "UP047", "B008"]

[tool.ruff.lint.per-file-ignores]
# E402: these modules append sys.path/set env vars before importing, or wrap
# optional imports in try/except.
"backend/ml_pipeline/deployment/api.py" = ["E402"]
"backend/ml_pipeline/execution/graph_utils.py" = ["E402"]
"backend/ml_pipeline/execution/schemas.py" = ["E402"]
"backend/ml_pipeline/model_registry/api.py" = ["E402"]
"backend/monitoring/router.py" = ["E402"]
"skyulf-core/skyulf/profiling/analyzer.py" = ["E402"]
# Notebook zip() pairs two same-length lists; out of scope for tooling.
"skyulf-core/examples/05_leakage_proof_titanic.ipynb" = ["B905"]
# PLC0415 (F-11): function-level imports are legitimate in tests, entry
# points, backend glue and benchmarks; enforcement scope is skyulf-core/skyulf/.
"backend/**" = ["PLC0415"]
"run_skyulf.py" = ["PLC0415"]
"celery_worker.py" = ["PLC0415"]
# D (pydocstyle, OC-09): waived for tests and teaching material only. Tests
# held 2,484 of the 3,350 remaining D sites, 1,852 of them "missing docstring"
# — no tool can write those, and demanding them by hand would have consumed the
# whole pass for zero defect-finding value, since the D rules that *do* catch
# problems are formatting ones already satisfied. The notebooks, example
# scripts and benchmarks are teaching material rather than shipped code, which
# is why they share the PLC0415 exemption above. Enforcement therefore covers
# `skyulf-core/skyulf/` and `backend/`, matching coding_standards §4 ("every
# function and method needs a docstring"). Test docstrings are still expected
# by that standard and by AGENTS.md — they are simply not machine-enforced.
"tests/**" = ["PLC0415", "D"]
"skyulf-core/tests/**" = ["PLC0415", "D"]
"skyulf-core/benchmarks/**" = ["PLC0415", "D"]
"docs/examples/**" = ["PLC0415", "D"]
"skyulf-core/examples/**" = ["PLC0415", "D"]

[tool.ruff.lint.isort]
known-first-party = ["skyulf", "backend"]

[tool.ruff.lint.pydocstyle]
# Google-style: the convention the codebase already writes (138 `Args:`/
# `Returns:`/`Raises:` section markers across skyulf-core and backend vs 1-2
# NumPy-style). Setting it is also technically required — without a convention
# ruff enables mutually exclusive pairs (D203/D211, D212/D213) that no
# docstring can satisfy simultaneously. The convention deactivates the rules
# that contradict Google style, so they are not enforced here.
convention = "google"

[tool.ruff.format]
# Black-compatible defaults; line-length inherited from [tool.ruff].

[tool.ty]
# Astral's Rust-based type checker. Replaces mypy in CI.
# See https://github.com/astral-sh/ty for full option reference.

[tool.ty.rules]
# Optional dependencies (s3fs, redis, xgboost, optuna, rich, matplotlib,
# vaderSentiment, causallearn, rapidfuzz, shap) are guarded by try/except
# ImportError. They're present in some dev environments and missing in CI,
# so per-line `# ty: ignore[unresolved-import]` ignores would be flagged
# as unused locally and required in CI. Silence the unused-ignore noise.
unused-ignore-comment = "ignore"
# Same reasoning: locally we may pass `cast(Any, x)` against a value ty
# narrows to `Any`, which is a no-op locally but necessary on other ty
# versions / when imports differ.
redundant-cast = "ignore"

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["skyulf-core"]

[tool.ty.src]
include = ["backend", "skyulf-core/skyulf", "skyulf-core/tests"]
exclude = [
    ".venv",
    "site",
    "exports",
    "uploads",
    "static",
    "frontend",
    "tmp_repro_artifacts",
    "build",
    "dist",
    "skyulf-core/skyulf/profiling/analyzer_backup.py",
]

[tool.uv]
required-version = ">=0.6,<1.0"

[tool.uv.sources]
skyulf-core = { workspace = true }

[tool.uv.workspace]
members = [
    "skyulf-core",
]

[tool.bandit]
# Bandit B101 (assert_used) flags every `assert`. In pytest suites `assert` is the
# idiomatic, correct construct, so we exclude test trees from Bandit entirely.
exclude_dirs = ["tests", "skyulf-core/tests", "temp", ".venv", "node_modules", "frontend"]

[tool.bandit.assert_used]
# Belt-and-suspenders: even if a test file is scanned outside the excluded dirs
# (e.g. conftest.py or a stray *_test.py), do not report asserts there.
skips = ["*/tests/*", "*_test.py", "*test_*.py", "*/conftest.py"]
