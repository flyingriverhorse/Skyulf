# Syrupy's `.ambr` files are generated too, and rewriting their whitespace is
# actively wrong: a multi-line snapshot value is serialised as an indented `'''`
# block, so a blank line *inside the value* is written as an indentation-only
# line. trim-trailing-whitespace strips it, the reader then round-trips a
# different string, and the snapshot test fails on a value nothing edited. This
# first bit `PipelineConfigModel`'s schema description, which pydantic derives
# from the model docstring — so it is a documented model, not a stray space.
# Regenerate snapshots with `--snapshot-update`; never hand-edit them.
#
# Generated/minified build outputs must never be touched by the auto-fix
# hooks (trailing-whitespace, end-of-file-fixer, ruff-format). Rewriting their
# whitespace is pointless and, when a file is partially staged, triggers
# pre-commit's stash/un-stash conflict → "Rolling back fixes" → aborted commit.
exclude: |
  (?x)^(
    static/ml_canvas/assets/.*|
    frontend/ml-canvas/dist/.*|
    .*\.min\.(js|css)|
    .*__snapshots__/.*\.ambr
  )$

repos:
  - repo: local
    hooks:
      - id: databricks-template-schema
        name: Databricks template schema and model catalog are up to date
        entry: uv run --no-sync python skyulf-core/templates/databricks/build_schema.py --check
        language: system
        files: ^skyulf-core/(templates/databricks/(schema/.*\.json|build_(schema|model_spaces)\.py|databricks_template_schema\.json|library/model_search_space\.tmpl)|skyulf/modeling/hyperparameters/.*\.py)$
        pass_filenames: false
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run --no-sync python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run --no-sync python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: check-yaml
        name: check yaml
        entry: uv run --no-sync python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-json
        name: check json
        entry: uv run --no-sync python -m pre_commit_hooks.check_json
        language: system
        types: [json]
        # tsconfig*.json files are JSONC (allow comments / trailing commas),
        # which the strict JSON parser can't read. The frontend lint/build
        # validates them instead.
        exclude: (^|/)tsconfig.*\.json$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff          # Lint (replaces flake8 + isort)
        args: [--fix]
      - id: ruff-format    # Format (replaces black)
  - repo: local
    hooks:
      - id: lizard-complexity
        name: Lizard complexity (backend and Core, CCN 10)
        entry: uv run --no-sync lizard backend skyulf-core/skyulf --CCN 10 -w
        language: system
        files: ^(backend/.*\.py|skyulf-core/skyulf/.*\.py|\.pre-commit-config\.yaml)$
        pass_filenames: false
      - id: ty
        name: ty (type check)
        # Mirrors the CI "Type check (ty)" step so type errors are caught on
        # commit, before CI. `uv tool run` fetches/runs ty without needing it
        # installed in the venv or on PATH.
        entry: uv run ty check backend skyulf-core/skyulf skyulf-core/tests run_skyulf.py celery_worker.py
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint (eslint)
        # Runs the frontend linter. Filters to run only when frontend TS/JSX source files change.
        entry: npm --prefix frontend/ml-canvas run lint
        language: system
        files: ^frontend/ml-canvas/src/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: frontend-complexity
        name: frontend complexity (ESLint, maximum 10)
        entry: npm --prefix frontend/ml-canvas run complexity:check
        language: system
        files: ^(frontend/ml-canvas/src/.*\.(ts|tsx|js|jsx)|\.pre-commit-config\.yaml)$
        pass_filenames: false
