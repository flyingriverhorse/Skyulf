# Ordered model transformations, fitted on training rows after the split.
# Select a recipe with preprocessing_recipe in config/training.yml (default: default).
# Built-ins use transformer + params. Custom factories live in src/features/preprocessing.py.
# Example recipes remain inactive until selected. Adapt their columns to your inputs.
version: 1
recipes:
  default: []
  none: []
  example_frequency:
    - custom: preprocessing.frequency_encoding
      params: {columns: [category]}
  example_imputer:
    - name: impute
      transformer: SimpleImputer
      params: {columns: [feature_value], strategy: mean}
  example_imputer_frequency:
    - name: impute
      transformer: SimpleImputer
      params: {columns: [feature_value], strategy: mean}
    - custom: preprocessing.frequency_encoding
      params: {columns: [category]}
  example_all:
    - name: impute
      transformer: SimpleImputer
      params: {columns: [feature_value], strategy: mean}
    - custom: preprocessing.log_feature
      params: {column: feature_value}
    - custom: preprocessing.rare_categories
      params: {column: category}
    - custom: preprocessing.frequency_encoding
      params: {columns: [category]}

