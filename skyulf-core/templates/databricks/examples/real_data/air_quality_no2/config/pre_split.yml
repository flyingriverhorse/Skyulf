# Fixed row eligibility before the chronological split; nothing here learns statistics.
# The station writes -200 when an instrument has no reading for that hour.
version: 1
recipes:
  default:
    # Feature-only rule: reused at scoring, where failed rows stay with reason pre_split:sensors_online.
    - custom: pre_split.sensors_online
      params: {columns: [pt08_s1_co, pt08_s2_nmhc, pt08_s3_nox, pt08_s4_no2, pt08_s5_o3, temperature]}
    # Target-only rule (built-in): training needs a measured NO2 value. Scoring skips it because
    # scoring.yml sets skip_target_pre_split_steps: true and requests carry no target.
    - name: measured_no2
      transformer: ManualBounds
      params: {bounds: {no2_gt: {lower: 0, upper: 1000}}}
