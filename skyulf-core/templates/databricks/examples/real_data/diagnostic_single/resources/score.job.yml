resources:
  jobs:
    score:
      name: ${bundle.name}_score
      tags: ${var.job_tags}

      budget_policy_id: ${var.serverless_budget_policy_id}

      timeout_seconds: ${var.score_timeout_seconds}
      email_notifications: ${var.score_email_notifications}
      webhook_notifications: ${var.score_webhook_notifications}
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: score_model_version
          default: ""

      tasks:
        - task_key: score
          timeout_seconds: ${var.score_task_timeout_seconds}
          max_retries: ${var.score_max_retries}
          min_retry_interval_millis: ${var.score_min_retry_interval_millis}
          retry_on_timeout: false
          notebook_task:

            notebook_path: ../src/jobs/score.py

            base_parameters:
              workflow_contract: "3"
              deployed_score_handoff: "disabled"
              deployed_auto_rebuild_on_cdf_expiry: "false"
              score_model_version: '{{job.parameters.score_model_version}}'
              job_run_id: '{{job.run_id}}'
              task_key: score
              workspace_host: ${workspace.host}
              config_path: ${workspace.file_path}/config/training.yml
              catalog: ${var.catalog}
              input_schema: ${var.input_schema}
              output_schema: ${var.output_schema}
              metadata_schema: ${var.metadata_schema}
              resource_suffix: ${var.resource_suffix}
              monitoring_enabled: ${var.monitoring_enabled}
              monitoring_execution_engine: spark
              monitoring_drift_thresholds: ${var.monitoring_drift_thresholds}
              monitoring_performance_policies: ${var.monitoring_performance_policies}
              monitoring_catalog: ${var.monitoring_catalog}
              monitoring_schema: ${var.monitoring_schema}
              development_monitoring_schema: ${var.development_monitoring_schema}
              monitoring_label_table: ${var.monitoring_label_table}
              monitoring_result_available_at_column: ${var.monitoring_result_available_at_column}
              monitoring_expected_interval_hours: ${var.monitoring_expected_interval_hours}
              monitoring_environment: ${bundle.target}
              monitoring_deployment_mode: ${bundle.mode}
              monitoring_project: ${bundle.name}

          environment_key: skyulf
          disable_auto_optimization: true


        - task_key: monitoring_allowed
          description: Monitor shared deployments, and development ones only with a development monitoring store
          depends_on:
            - task_key: score
          condition_task:
            # Shared targets always register; development only with its own monitoring store.
            op: NOT_EQUAL
            left: "${bundle.mode}:${var.monitoring_enabled}"
            right: "development:false"
        - task_key: prepare_monitoring
          description: Validate the successful scoring receipt for the separate Spark monitoring job
          depends_on:
            - task_key: monitoring_allowed
              outcome: "true"
          timeout_seconds: ${var.score_task_timeout_seconds}
          max_retries: ${var.score_max_retries}
          min_retry_interval_millis: ${var.score_min_retry_interval_millis}
          retry_on_timeout: false
          notebook_task:
            notebook_path: ../src/jobs/prepare_monitoring.py
            base_parameters:
              job_run_id: '{{job.run_id}}'
              task_key: prepare_monitoring
              workspace_host: ${workspace.host}
              workflow_contract: "3"
              deployed_score_handoff: "disabled"
              deployed_auto_rebuild_on_cdf_expiry: "false"
              score_model_version: '{{job.parameters.score_model_version}}'
              config_path: ${workspace.file_path}/config/training.yml
              catalog: ${var.catalog}
              input_schema: ${var.input_schema}
              output_schema: ${var.output_schema}
              metadata_schema: ${var.metadata_schema}
              resource_suffix: ${var.resource_suffix}
              monitoring_experiment_name: ${var.monitoring_experiment_name}
              monitoring_dashboard_url: ${var.monitoring_dashboard_url}
              monitoring_enabled: ${var.monitoring_enabled}
              monitoring_execution_engine: spark
              monitoring_drift_thresholds: ${var.monitoring_drift_thresholds}
              monitoring_performance_policies: ${var.monitoring_performance_policies}
              monitoring_catalog: ${var.monitoring_catalog}
              monitoring_schema: ${var.monitoring_schema}
              development_monitoring_schema: ${var.development_monitoring_schema}
              monitoring_label_table: ${var.monitoring_label_table}
              monitoring_result_available_at_column: ${var.monitoring_result_available_at_column}
              monitoring_expected_interval_hours: ${var.monitoring_expected_interval_hours}
              monitoring_environment: ${bundle.target}
              monitoring_deployment_mode: ${bundle.mode}
              monitoring_project: ${bundle.name}

          environment_key: skyulf
          disable_auto_optimization: true

        - task_key: monitoring_ready
          description: Skip child monitoring when disabled or no observation is needed
          depends_on:
            - task_key: prepare_monitoring
          condition_task:
            op: EQUAL_TO
            left: '{{tasks.prepare_monitoring.values.monitoring_ready}}'
            right: "true"
        - task_key: monitor_model
          description: Run the separate Spark monitoring job for the validated scoring receipt
          depends_on:
            - task_key: monitoring_ready
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.monitoring.id}
            job_parameters:
              monitoring_request: '{{tasks.prepare_monitoring.values.monitoring_request_json}}'
              score_model_version: '{{job.parameters.score_model_version}}'

      environments:
        - environment_key: skyulf
          spec:
            client: ${var.serverless_environment_version}
            dependencies:
              - -r ${workspace.file_path}/deployment/requirements.txt

