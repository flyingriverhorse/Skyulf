# Scoring controls and output destinations. No model is trained by this file.
version: 1
inference_mode: spark
spark_udf_env_manager: local
spark_udf_prediction_batch_rows: 10000
score_source_table: "{catalog}.{input_schema}.observations_score"
prediction_table: "{catalog}.{output_schema}.component_predictions{resource_suffix}"
score_model_selection: pinned_version
model_version: "1"
model_change_mode: incremental_append
auto_rebuild_on_cdf_expiry: false
score_handoff: disabled
model_set:
  model_name: "{catalog}.{metadata_schema}.demand_set{resource_suffix}"
  prediction_table: "{catalog}.{output_schema}.predictions{resource_suffix}"
  promotion_policy: manual_approval
  combined_rules_path: ../features
  source_change_policy: reject
  publication:
    mode: all

