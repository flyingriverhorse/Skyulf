# Scoring controls and output destinations. No model is trained by this file.
version: 1
prediction_delivery: batch
batch_compute: single_node
# from_now checkpoints without predictions on the first run; rebuilds keep that boundary.
initial_scoring: full_snapshot
score_source_table: "{catalog}.{input_schema}.trips_score"
prediction_table: "{catalog}.{output_schema}.taxi_trips_predictions{resource_suffix}"
score_model_selection: pinned_version
model_version: "1"
on_model_change: score_new_rows
rescore_when_history_expires: false
follow_champion: false
model_set:
  model_name: "{catalog}.{metadata_schema}.trips_set{resource_suffix}"
  prediction_table: "{catalog}.{output_schema}.trips_set_predictions{resource_suffix}"
  promotion_policy: manual_approval
  combined_rules_path: ../features
  on_source_change: stop
  publication:
    mode: all

