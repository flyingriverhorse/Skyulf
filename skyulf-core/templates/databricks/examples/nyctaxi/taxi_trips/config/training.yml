# Shared training settings; model entries override whole values from defaults.
# Custom transformations stay in src/features. Scoring uses the saved fitted model.
# preprocessing_recipe selects a list in config/preprocessing.yml.
# pre_split_recipe selects a list in config/pre_split.yml.
# Keep custom functions in src/features/preprocessing.py and pre_split.py.
# See PREPROCESSING.md; do not add pipeline.preprocessing here.
version: 1
defaults:
  config_version: 1
  training_layout: multi_target
  engine: pandas

  preprocessing_probe: true # Optional preprocessing diagnostics; first 256 holdout rows, 8 MiB. See PREPROCESSING_CONTEXT.md.
  training_table: "{catalog}.{input_schema}.trips_train"
  record_key_columns: ["trip_id"]
  model_name: "{catalog}.{metadata_schema}.taxi_trips_model{resource_suffix}"
  promotion_policy: manual_approval
  evaluation_charts: {enabled: true}
models:

  "fare":
    model_name: "{catalog}.{metadata_schema}.taxi_trips_fare{resource_suffix}"
    preprocessing_recipe: fare_inputs
    pre_split_recipe: valid_fare
    task: regression
    input_columns: ["pickup_hour", "pickup_dow", "trip_distance", "duration_min", "pickup_zip"]
    target_column: "fare_amount"
    split_strategy: random
    training_window_mode: full_snapshot
    test_size: 0.2
    random_state: 42
    stratify: false
    cv_enabled: true
    cv_folds: 3
    cv_type: k_fold
    cv_shuffle: true
    cv_random_state: 42
    filter_unavailable_results: false
    max_rows: 12000
    max_input_mb: 64
    metric: heldout_rmse
    min_improvement: 0
    quality_threshold: 6.0

    model:
      type: hist_gradient_boosting_regressor
    tuning:
      strategy: grid
      metric: rmse
      n_trials: 3
      random_state: 42
      max_candidates: 1000
      search_space: {"learning_rate": [0.05, 0.1, 0.2], "max_iter": [100, 200, 500], "max_leaf_nodes": [31, 63], "min_samples_leaf": [20, 50]}

  "long_trip":
    model_name: "{catalog}.{metadata_schema}.taxi_trips_long_trip{resource_suffix}"
    preprocessing_recipe: zone_inputs
    pre_split_recipe: known_zones
    task: classification
    input_columns: ["pickup_hour", "pickup_dow", "pickup_zip", "dropoff_zip"]
    target_column: "long_trip"
    split_strategy: random
    training_window_mode: full_snapshot
    test_size: 0.2
    random_state: 42
    stratify: true
    cv_enabled: false
    filter_unavailable_results: false
    max_rows: 12000
    max_input_mb: 64
    metric: heldout_f1
    min_improvement: 0
    quality_threshold: 0.3

    model:
      type: random_forest_classifier
    tuning:
      strategy: halving_random
      metric: accuracy
      n_trials: 8
      random_state: 42
      strategy_params:
        factor: 3
        resource: n_samples
        min_resources: "exhaust"
      search_space: {"bootstrap": [true, false], "criterion": ["gini", "entropy", "log_loss"], "max_depth": [null, 5, 10, 20, 30, 50], "min_samples_leaf": [1, 2, 4, 8], "min_samples_split": [2, 5, 10, 20], "n_estimators": [50, 100, 200, 500]}

