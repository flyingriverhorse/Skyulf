resources:
  jobs:
    train:
      name: ${bundle.name}_train
      tags: ${var.job_tags}

      budget_policy_id: ${var.serverless_budget_policy_id}

      timeout_seconds: ${var.train_timeout_seconds}
      health:
        rules: ${var.train_health_rules}
      email_notifications: ${var.train_email_notifications}
      webhook_notifications: ${var.train_webhook_notifications}
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
        - name: lifecycle_action
          default: train
        - name: candidate_version
          default: ""
        - name: expected_champion_version
          default: ""
        - name: rejection_reason
          default: ""
        - name: promotion_receipt_json
          default: ""
        - name: allow_unloadable_champion
          default: ""

      tasks:

        - &lifecycle_task
          task_key: initialize_run
          max_retries: 0
          retry_on_timeout: false
          timeout_seconds: ${var.train_task_timeout_seconds}
          notebook_task:
            notebook_path: ../src/jobs/initialize_run.py
            base_parameters: &lifecycle_parameters

              model_keys_json: '["logistic_regression_1", "xgboost_classifier_2", "voting_classifier_3", "stacking_classifier_4"]'

              workflow_contract: "3"
              job_id: '{{job.id}}'
              job_run_id: '{{job.run_id}}'
              workspace_host: ${workspace.host}
              repair_count: '{{job.repair_count}}'
              execution_count: '{{task.execution_count}}'
              deployed_score_handoff: "after_alias_change"
              deployed_auto_rebuild_on_cdf_expiry: "false"
              lifecycle_action: '{{job.parameters.lifecycle_action}}'
              candidate_version: '{{job.parameters.candidate_version}}'
              expected_champion_version: '{{job.parameters.expected_champion_version}}'
              rejection_reason: '{{job.parameters.rejection_reason}}'
              promotion_receipt_json: '{{job.parameters.promotion_receipt_json}}'
              allow_unloadable_champion: '{{job.parameters.allow_unloadable_champion}}'
              config_path: ${workspace.file_path}/config/training.yml
              experiment_name: ${workspace.root_path}/experiment
              catalog: ${var.catalog}
              input_schema: ${var.input_schema}
              output_schema: ${var.output_schema}
              metadata_schema: ${var.metadata_schema}
              resource_suffix: ${var.resource_suffix}
              monitoring_enabled: ${var.monitoring_enabled}
              monitoring_execution_engine: spark
              monitoring_job_id: ${resources.jobs.monitoring.id}
              monitoring_drift_thresholds: ${var.monitoring_drift_thresholds}
              monitoring_performance_policies: ${var.monitoring_performance_policies}
              monitoring_catalog: ${var.monitoring_catalog}
              monitoring_schema: ${var.monitoring_schema}
              monitoring_label_table: ${var.monitoring_label_table}
              monitoring_result_available_at_column: ${var.monitoring_result_available_at_column}
              monitoring_expected_interval_hours: ${var.monitoring_expected_interval_hours}
              monitoring_environment: ${bundle.target}
              monitoring_deployment_mode: ${bundle.mode}
              monitoring_project: ${bundle.name}

          environment_key: skyulf
          disable_auto_optimization: true

        - task_key: choose_action
          depends_on:
            - task_key: initialize_run
          max_retries: 0
          condition_task:
            op: EQUAL_TO
            left: '{{tasks.initialize_run.values.training_requested}}'
            right: "true"
        - <<: *lifecycle_task
          task_key: load_data
          depends_on:
            - task_key: choose_action
              outcome: "true"
          notebook_task:
            notebook_path: ../src/jobs/load_data.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.initialize_run.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'
        - <<: *lifecycle_task
          task_key: prepare_dataset
          depends_on:
            - task_key: load_data
          notebook_task:
            notebook_path: ../src/jobs/prepare_dataset.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.load_data.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        # BEGIN MODEL TASKS


        - <<: *lifecycle_task
          task_key: train_logistic_regression_1
          depends_on:
            - task_key: prepare_dataset
          notebook_task:
            notebook_path: ../src/jobs/train_model.py
            base_parameters:
              <<: *lifecycle_parameters
              model_key: "logistic_regression_1"
              reference_json: '{{tasks.prepare_dataset.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: shap_logistic_regression_1
          depends_on:
            - task_key: train_logistic_regression_1
          notebook_task:
            notebook_path: ../src/jobs/shap_report.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.train_logistic_regression_1.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'


        - <<: *lifecycle_task
          task_key: train_xgboost_classifier_2
          depends_on:
            - task_key: prepare_dataset
          notebook_task:
            notebook_path: ../src/jobs/train_model.py
            base_parameters:
              <<: *lifecycle_parameters
              model_key: "xgboost_classifier_2"
              reference_json: '{{tasks.prepare_dataset.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: shap_xgboost_classifier_2
          depends_on:
            - task_key: train_xgboost_classifier_2
          notebook_task:
            notebook_path: ../src/jobs/shap_report.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.train_xgboost_classifier_2.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'


        - <<: *lifecycle_task
          task_key: train_voting_classifier_3
          depends_on:
            - task_key: prepare_dataset
          notebook_task:
            notebook_path: ../src/jobs/train_model.py
            base_parameters:
              <<: *lifecycle_parameters
              model_key: "voting_classifier_3"
              reference_json: '{{tasks.prepare_dataset.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: shap_voting_classifier_3
          depends_on:
            - task_key: train_voting_classifier_3
          notebook_task:
            notebook_path: ../src/jobs/shap_report.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.train_voting_classifier_3.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'


        - <<: *lifecycle_task
          task_key: train_stacking_classifier_4
          depends_on:
            - task_key: prepare_dataset
          notebook_task:
            notebook_path: ../src/jobs/train_model.py
            base_parameters:
              <<: *lifecycle_parameters
              model_key: "stacking_classifier_4"
              reference_json: '{{tasks.prepare_dataset.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: shap_stacking_classifier_4
          depends_on:
            - task_key: train_stacking_classifier_4
          notebook_task:
            notebook_path: ../src/jobs/shap_report.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.train_stacking_classifier_4.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        # END MODEL TASKS
        - <<: *lifecycle_task
          task_key: select_best_model
          depends_on:
            # BEGIN MODEL DEPENDENCIES

            - task_key: train_logistic_regression_1

            - task_key: train_xgboost_classifier_2

            - task_key: train_voting_classifier_3

            - task_key: train_stacking_classifier_4

            # END MODEL DEPENDENCIES
          notebook_task:
            notebook_path: ../src/jobs/select_best_model.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.prepare_dataset.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: register_model
          depends_on:
            - task_key: select_best_model
          notebook_task:
            notebook_path: ../src/jobs/register_model.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.select_best_model.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'
        - <<: *lifecycle_task
          task_key: evaluate_model
          depends_on:
            - task_key: register_model
          notebook_task:
            notebook_path: ../src/jobs/evaluate_model.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.register_model.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - <<: *lifecycle_task
          task_key: generate_charts
          depends_on:
            - task_key: evaluate_model
          notebook_task:
            notebook_path: ../src/jobs/generate_charts.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.evaluate_model.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'
              workspace_host: ${workspace.host}

        - <<: *lifecycle_task
          task_key: model_decision
          run_if: NONE_FAILED
          depends_on:
            - task_key: choose_action
              outcome: "false"
            - task_key: evaluate_model
          notebook_task:
            notebook_path: ../src/jobs/model_decision.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.initialize_run.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'
        - <<: *lifecycle_task
          task_key: training_report
          run_if: ALL_DONE
          depends_on:
            - task_key: model_decision
          notebook_task:
            notebook_path: ../src/jobs/training_report.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.initialize_run.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'
              decision_result_state: '{{tasks.model_decision.result_state}}'
              workspace_host: ${workspace.host}

        - task_key: monitoring_allowed
          description: Register shared deployments only; skip ephemeral development models
          max_retries: 0
          depends_on:
            - task_key: training_report
          condition_task:
            op: EQUAL_TO
            left: ${bundle.mode}
            right: production

        - <<: *lifecycle_task
          task_key: register_monitor
          depends_on:
            - task_key: monitoring_allowed
              outcome: "true"
          notebook_task:
            notebook_path: ../src/jobs/register_monitor.py
            base_parameters:
              <<: *lifecycle_parameters
              reference_json: '{{tasks.training_report.values.reference_json}}'
              tracking_uri: '{{tasks.initialize_run.values.tracking_uri}}'

        - task_key: scoring_requested
          run_if: NONE_FAILED
          depends_on:
            - task_key: monitoring_allowed
              outcome: "false"
            - task_key: register_monitor
          max_retries: 0
          condition_task:
            op: EQUAL_TO
            left: '{{tasks.training_report.values.score_requested}}'
            right: "true"
        - task_key: run_batch_scoring
          max_retries: 0
          depends_on:
            - task_key: scoring_requested
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.score.id}
            job_parameters:
              score_model_version: ""

      environments:
        - environment_key: skyulf
          spec:
            client: ${var.serverless_environment_version}
            dependencies:
              - -r ${workspace.file_path}/deployment/train-requirements.txt

