# Shared training settings; model entries override whole values from defaults.
# Custom transformations stay in src/features. Scoring uses the saved fitted model.
# preprocessing_recipe selects a list in config/preprocessing.yml.
# pre_split_recipe selects a list in config/pre_split.yml.
# Keep custom functions in src/features/preprocessing.py and pre_split.py.
# See PREPROCESSING.md; do not add pipeline.preprocessing here.
version: 1
defaults:
  config_version: 1
  training_layout: model_competition
  engine: polars

  preprocessing_probe: true # Optional preprocessing diagnostics; first 256 holdout rows, 8 MiB. See PREPROCESSING_CONTEXT.md.
  # Spark and online-feature projects check admission automatically, even when false below.
  # Set true for endpoint-only projects to seal the same lint + probe evidence during training.
  # Details: https://www.skyulf.com/manual/user_guide/databricks_spark_scoring.html
  admit_probed_custom_steps: false
  training_table: "{catalog}.{input_schema}.trips_train"
  record_key_columns: ["trip_id"]
  model_name: "{catalog}.{metadata_schema}.taxi_high_fare_model{resource_suffix}"
  promotion_policy: manual_approval
  evaluation_charts: {enabled: true}
  explainability: {method: shap, max_samples: 100, max_features: 30, max_display_samples: 3}
  task: classification
  input_columns: ["pickup_hour", "pickup_dow", "trip_distance", "duration_min", "pickup_zip", "dropoff_zip"]
  target_column: "high_fare"
  split_strategy: random
  training_window_mode: full_snapshot
  test_size: 0.2
  random_state: 42
  stratify: true
  cv_enabled: true
  cv_folds: 3
  cv_type: nested_cv
  cv_shuffle: true
  cv_random_state: 42
  cv_nested_type: stratified_k_fold
  cv_inner_folds: 2
  filter_unavailable_results: false
  max_rows: 25000
  max_input_mb: 64
  metric: heldout_f1
  min_improvement: 0
  # Candidate coverage and allowed loss versus champion; null disables either gate.
  min_scored_fraction: 0.90
  max_coverage_drop: 0.05 # 0.05 = five percentage points.
  quality_threshold: 0.5
  competition_max_trials: 1000
  competition_max_candidates: 8
  preprocessing_recipe: zones_and_trips
models:

  logistic_regression_1:
    model:
      type: logistic_regression
    tuning:
      strategy: random
      metric: f1
      n_trials: 3
      random_state: 42
      tune_threshold: true
      search_space: {"C": [0.001, 0.01, 0.1, 1.0, 10.0, 100.0], "max_iter": [100, 200, 500, 1000, 2000, 5000], "penalty": ["l1", "l2"], "solver": ["saga"]}

  xgboost_classifier_2:
    model:
      type: xgboost_classifier
    tuning:
      strategy: random
      metric: f1
      n_trials: 3
      random_state: 42
      tune_threshold: true
      search_space: {"colsample_bytree": [0.6, 0.8, 1.0], "learning_rate": [0.01, 0.05, 0.1, 0.3], "max_depth": [3, 5, 7, 9], "min_child_weight": [1, 3, 5, 7], "n_estimators": [100, 200, 500, 1000], "reg_alpha": [0.0, 0.01, 0.1, 1.0], "reg_lambda": [0.1, 1.0, 5.0, 10.0], "subsample": [0.6, 0.8, 1.0]}

  voting_classifier_3:
    model:
      type: voting_classifier
      params: {
          "base_estimators": ["logistic_regression", "random_forest"],
          "tune_base_models": true,
          "n_jobs": 1,
          "calibrate_base_models": false,
          "calibration_cv": 3,
          "weights": [1, 1],
          "voting": "soft"
      }
    tuning:
      strategy: random
      metric: f1
      n_trials: 3
      random_state: 42
      tune_threshold: true
      search_space: {"logistic_regression__C": [0.001, 0.01, 0.1, 1.0, 10.0, 100.0], "logistic_regression__max_iter": [100, 200, 500, 1000, 2000, 5000], "logistic_regression__penalty": ["l1", "l2"], "logistic_regression__solver": ["saga"], "random_forest__bootstrap": [true, false], "random_forest__criterion": ["gini", "entropy", "log_loss"], "random_forest__max_depth": [null, 5, 10, 20, 30, 50], "random_forest__min_samples_leaf": [1, 2, 4, 8], "random_forest__min_samples_split": [2, 5, 10, 20], "random_forest__n_estimators": [50, 100, 200, 500]}

  stacking_classifier_4:
    model:
      type: stacking_classifier
      params: {
          "base_estimators": ["random_forest", "extra_trees"],
          "tune_base_models": true,
          "n_jobs": 1,
          "calibrate_base_models": false,
          "calibration_cv": 3,
          "cv": 3,
          "final_estimator": "logistic_regression",
          "passthrough": false
      }
    tuning:
      strategy: random
      metric: f1
      n_trials: 3
      random_state: 42
      tune_threshold: true
      search_space: {"random_forest__bootstrap": [true, false], "random_forest__criterion": ["gini", "entropy", "log_loss"], "random_forest__max_depth": [null, 5, 10, 20, 30, 50], "random_forest__min_samples_leaf": [1, 2, 4, 8], "random_forest__min_samples_split": [2, 5, 10, 20], "random_forest__n_estimators": [50, 100, 200, 500], "extra_trees__bootstrap": [false, true], "extra_trees__criterion": ["gini", "entropy", "log_loss"], "extra_trees__max_depth": [null, 5, 10, 20, 50], "extra_trees__min_samples_leaf": [1, 2, 4], "extra_trees__min_samples_split": [2, 5, 10], "extra_trees__n_estimators": [50, 100, 200, 500], "final_estimator__C": [0.001, 0.01, 0.1, 1.0, 10.0, 100.0], "final_estimator__max_iter": [100, 200, 500, 1000, 2000, 5000], "final_estimator__penalty": ["l1", "l2"], "final_estimator__solver": ["saga"]}

