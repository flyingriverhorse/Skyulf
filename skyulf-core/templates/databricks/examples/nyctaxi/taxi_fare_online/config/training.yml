# Shared training settings; model entries override whole values from defaults.
# Custom transformations stay in src/features. Scoring uses the saved fitted model.
# preprocessing_recipe selects a list in config/preprocessing.yml.
# pre_split_recipe selects a list in config/pre_split.yml.
# Keep custom functions in src/features/preprocessing.py and pre_split.py.
# See PREPROCESSING.md; do not add pipeline.preprocessing here.
version: 1
defaults:
  config_version: 1
  training_layout: single_model
  engine: pandas
  # Complete these declarations before training; all lookup outputs must be input_columns.
  # Use pandas and non-temporal lookups. Each lookup needs a fitted DOUBLE UTC epoch field.
  feature_lookup:
    lookups:
      - table_name: "{catalog}.{input_schema}.zone_features"
        lookup_key: [pickup_zip]
        feature_names: [zone_avg_distance, zone_trip_count, zone_updated_at]
  online_features:
    required_features: [zone_avg_distance, zone_trip_count, zone_updated_at]
    freshness:
      - column: zone_updated_at
        max_age_seconds: 604800.0 # Refresh zone_features at least weekly.

  preprocessing_probe: true # Optional preprocessing diagnostics; first 256 holdout rows, 8 MiB. See PREPROCESSING_CONTEXT.md.
  training_table: "{catalog}.{input_schema}.trips_train"
  record_key_columns: ["trip_id"]
  model_name: "{catalog}.{metadata_schema}.taxi_fare_online_model{resource_suffix}"
  promotion_policy: manual_approval
  evaluation_charts: {enabled: false}
  task: regression
  input_columns: ["pickup_hour", "pickup_dow", "trip_distance", "duration_min", "zone_avg_distance", "zone_trip_count", "zone_updated_at"]
  target_column: "fare_amount"
  split_strategy: random
  training_window_mode: full_snapshot
  test_size: 0.2
  random_state: 42
  stratify: false
  cv_enabled: true
  cv_folds: 3
  cv_type: k_fold
  cv_shuffle: true
  cv_random_state: 42
  filter_unavailable_results: false
  max_rows: 25000
  max_input_mb: 64
  metric: heldout_rmse
  min_improvement: 0
  # Candidate coverage and allowed loss versus champion; null disables either gate.
  min_scored_fraction: 0.90
  max_coverage_drop: 0.05 # 0.05 = five percentage points.
  quality_threshold: 6.0
models:

  main:
    model:
      type: random_forest_regressor
    tuning:
      strategy: optuna
      metric: rmse
      n_trials: 6
      random_state: 42
      strategy_params:
        sampler: tpe
        pruner: median
        pruning: true
      search_space: {"bootstrap": [true, false], "criterion": ["squared_error", "friedman_mse", "absolute_error"], "max_depth": [null, 5, 10, 20, 30, 50], "min_samples_leaf": [1, 2, 4, 8], "min_samples_split": [2, 5, 10, 20], "n_estimators": [50, 100, 200, 500]}

