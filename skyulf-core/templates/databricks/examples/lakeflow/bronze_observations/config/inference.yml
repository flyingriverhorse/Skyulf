# Scoring controls and output destinations. No model is trained by this file.
version: 1
prediction_delivery: batch
batch_compute: single_node
# full_snapshot predicts existing rows. from_now skips them on the first run and
# predicts later inserts only, including after model changes or recovery.
initial_scoring: full_snapshot
score_source_table: "{catalog}.{input_schema}.observations"
prediction_table: "{catalog}.{output_schema}.bronze_observations_predictions{resource_suffix}"
score_model_selection: pinned_version
model_version: "1"
on_model_change: score_new_rows
rescore_when_history_expires: false
follow_champion: false

