# Shared training settings; model entries override whole values from defaults.
# Custom transformations stay in src/features. Scoring uses the saved fitted model.
# preprocessing_recipe selects a list in config/preprocessing.yml.
# pre_split_recipe selects a list in config/pre_split.yml.
# Keep custom functions in src/features/preprocessing.py and pre_split.py.
# See GUIDE.md#preprocessing-and-custom-code; do not add pipeline.preprocessing here.
version: 1
defaults:
  config_version: 1
  training_layout: single_model
  engine: pandas

  save_preprocessing_diagnostics: true # Optional preprocessing diagnostics; first 256 holdout rows, 8 MiB. See GUIDE.md#preprocessing-and-custom-code.
  # Spark and online-feature projects check admission automatically, even when false below.
  # Set true to check preprocessing during training and save the results needed for endpoint deployment.
  # Details: https://www.skyulf.com/manual/user_guide/databricks_spark_scoring.html
  probe_pipeline_for_serving: false
  training_table: "{catalog}.{input_schema}.observations"
  record_key_columns: ["entity_id", "observed_on"]
  model_name: "{catalog}.{metadata_schema}.bronze_observations_model{resource_suffix}"
  promotion_policy: manual_approval
  evaluation_charts: {enabled: false}
  task: regression
  input_columns: ["region_code", "employee_count", "revenue"]
  target_column: "age"
  split_strategy: random
  training_window_mode: full_snapshot
  test_size: 0.2
  random_state: 42
  stratify: false
  cv_enabled: false
  filter_unavailable_results: false # true: skip rows with no result date (or after result_cutoff); they do not count toward max_rows. multi_target skips empty branch targets automatically
  skip_missing_targets: true # skip rows whose target is empty; they do not count toward max_rows
  max_rows: 10000
  max_input_mb: 64
  metric: heldout_rmse
  min_improvement: 0
  # Candidate coverage and allowed loss versus champion; null disables either gate.
  min_scored_fraction: 0.90
  max_coverage_drop: 0.05 # 0.05 = five percentage points.
models:

  main:
    model:
      type: linear_regression
    tuning:
      strategy: random
      metric: rmse
      n_trials: 10
      random_state: 42
      search_space: {"fit_intercept": [true, false]}

