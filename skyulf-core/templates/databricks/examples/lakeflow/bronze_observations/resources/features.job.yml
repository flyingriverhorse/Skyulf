# Generated by refresh_feature_graph.py; edit config/features.yml.
resources:
  jobs:
    features:
      tags: ${var.job_tags}
      environments:
      - environment_key: skyulf
        spec:
          client: ${var.serverless_environment_version}
          dependencies:
          - -r ${workspace.file_path}/deployment/train-requirements.txt
      budget_policy_id: ${var.serverless_budget_policy_id}
      timeout_seconds: ${var.train_timeout_seconds}
      email_notifications: ${var.train_email_notifications}
      webhook_notifications: ${var.train_webhook_notifications}
      name: ${bundle.name}_features
      max_concurrent_runs: 1
      queue:
        enabled: true
      parameters:
      - name: selected_groups
        default: '*'
      tasks:
      - environment_key: skyulf
        timeout_seconds: ${var.train_task_timeout_seconds}
        disable_auto_optimization: true
        task_key: initialize_features
        max_retries: 0
        retry_on_timeout: false
        notebook_task:
          notebook_path: ../src/jobs/feature_task.py
          base_parameters:
            config_path: ${workspace.file_path}/config/features.yml
            plan_sha256: cbfd8e2bee3e27271a9f927e306c00af073761aa0ec07e101295d01738e62fd7
            catalog: ${var.catalog}
            input_schema: ${var.input_schema}
            output_schema: ${var.output_schema}
            metadata_schema: ${var.metadata_schema}
            resource_suffix: ${var.resource_suffix}
            selected_groups: '{{job.parameters.selected_groups}}'
            phase: initialize
      - environment_key: skyulf
        timeout_seconds: ${var.train_task_timeout_seconds}
        disable_auto_optimization: true
        task_key: merge_features
        max_retries: 0
        retry_on_timeout: false
        notebook_task:
          notebook_path: ../src/jobs/feature_task.py
          base_parameters:
            config_path: ${workspace.file_path}/config/features.yml
            plan_sha256: cbfd8e2bee3e27271a9f927e306c00af073761aa0ec07e101295d01738e62fd7
            catalog: ${var.catalog}
            input_schema: ${var.input_schema}
            output_schema: ${var.output_schema}
            metadata_schema: ${var.metadata_schema}
            resource_suffix: ${var.resource_suffix}
            selected_groups: '{{job.parameters.selected_groups}}'
            snapshot_json: '{{tasks.initialize_features.values.snapshot_json}}'
            phase: merge
        depends_on:
        - task_key: initialize_features
