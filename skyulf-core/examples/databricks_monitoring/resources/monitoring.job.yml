resources:
  jobs:
    monitoring:
      name: skyulf-shared-monitoring-${bundle.target}
      max_concurrent_runs: 1
      queue:
        enabled: true
      timeout_seconds: 1800
      tasks:
        - task_key: observe_models
          max_retries: 0
          timeout_seconds: 1800
          environment_key: monitoring_env
          notebook_task:
            notebook_path: ../src/monitoring_notebook.py
            base_parameters:
              monitoring_catalog: ${var.monitoring_catalog}
              monitoring_schema: ${var.monitoring_schema}
              experiment_name: ${var.experiment_name}
              as_of: ""
              window_start: ""
              window_end: ""
      environments:
        - environment_key: monitoring_env
          spec:
            client: "4"
            dependencies:
              - ${var.wheel_path}
              - mlflow==3.16.1
              - imbalanced-learn>=0.14.1,<1.0.0
              - sklearn-compat==0.1.5
